<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMOX CONTROL</title>

    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}
        button,input,select,textarea{font:inherit}
        button{cursor:pointer}
        .app{display:flex;min-height:100vh}
        .sidebar{width:250px;background:#081a2d;color:#fff;padding:20px 14px;position:fixed;left:0;top:0;bottom:0;overflow:auto}
        .brand{padding:10px 12px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:15px}
        .brand strong{font-size:22px}
        .brand small{display:block;color:#9fb5d0;margin-top:5px}
        .user-box{background:#102945;border-radius:12px;padding:12px;margin-bottom:15px}
        .user-box strong{display:block}
        .user-box small{color:#9fb5d0}
        .nav-title{font-size:11px;color:#7189a5;text-transform:uppercase;margin:18px 10px 7px}
        .nav button{width:100%;border:0;background:transparent;color:#dbe7f4;text-align:left;padding:11px 12px;border-radius:8px;margin-bottom:3px}
        .nav button:hover,.nav button.active{background:#17395e;color:#fff}
        .logout{margin-top:18px;width:100%;border:1px solid #375270;background:transparent;color:#fff;padding:10px;border-radius:8px}
        .content{margin-left:250px;width:calc(100% - 250px);padding:24px}
        .topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}
        .topbar h1{margin:0;font-size:26px}
        .topbar p{margin:5px 0 0;color:#718096;font-size:13px}
        .warehouse{background:#fff;border:1px solid #e5e7eb;border-radius:9px;padding:9px 13px;font-size:12px;color:#334155}
        .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
        .stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:17px}
        .stat small{display:block;color:#718096;margin-bottom:8px}
        .stat b{font-size:23px}
        .stat.blue{border-top:4px solid #2563eb}
        .stat.green{border-top:4px solid #16a34a}
        .stat.orange{border-top:4px solid #f59e0b}
        .stat.red{border-top:4px solid #dc2626}
        .panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px}
        .panel h3{margin:0 0 14px}
        .dashboard-hero{display:grid;grid-template-columns:1.6fr .8fr;gap:14px;margin-bottom:16px}
        .hero-panel{background:linear-gradient(135deg,#0b1d33,#123866);color:#fff;border-radius:14px;padding:22px}
        .hero-panel small{color:#9fb5d0}
        .hero-panel h3{font-size:24px;margin:7px 0}
        .hero-panel p{color:#c9d6e5;font-size:13px;line-height:1.5}
        .quick-panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px}
        .quick-panel h3{margin-top:0}
        .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
        .section-title h3{margin:0}
        .stock-highlight{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
        .mini-stat{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:12px}
        .mini-stat small{display:block;color:#718096}
        .mini-stat strong{display:block;font-size:18px;margin-top:4px}
        .project-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
        .history-title{display:flex;align-items:center;justify-content:space-between;gap:12px}
        .history-badge{background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:bold}
        .edit-material{white-space:nowrap}
        .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
        .form-group{display:flex;flex-direction:column;gap:6px}
        .form-group.full{grid-column:1/-1}
        .form-group label{font-size:12px;font-weight:bold;color:#475569}
        .form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid #d7dee8;border-radius:8px;padding:10px;background:#fff;color:#172033;outline:none}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#2563eb}
        .btn{border:0;background:#2563eb;color:#fff;border-radius:8px;padding:10px 15px;font-weight:bold}
        .btn:hover{background:#1d4ed8}
        .btn-secondary{background:#e8eef6;color:#243b53}
        .btn-secondary:hover{background:#dbe5f0}
        .btn-danger{background:#dc2626}
        .btn-danger:hover{background:#b91c1c}
        table{width:100%;border-collapse:collapse}
        th{text-align:left;background:#f8fafc;color:#64748b;font-size:11px;text-transform:uppercase;padding:11px;border-bottom:1px solid #e5e7eb}
        td{padding:11px;border-bottom:1px solid #edf0f4;font-size:13px}
        tr:last-child td{border-bottom:0}
        .status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:bold}
        .status.ok{background:#dcfce7;color:#166534}
        .status.low{background:#fef3c7;color:#92400e}
        .status.active{background:#dbeafe;color:#1d4ed8}
        .status.done{background:#dcfce7;color:#166534}
        .status.cancelled{background:#fee2e2;color:#991b1b}
        .search{width:280px;border:1px solid #d7dee8;border-radius:8px;padding:9px}
        .progress{background:#e5e7eb;border-radius:999px;height:8px;overflow:hidden;min-width:90px}
        .progress>span{display:block;height:100%;background:#2563eb}
        .summary-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
        .summary{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:13px}
        .summary small{display:block;color:#718096}
        .summary strong{font-size:18px;display:block;margin-top:5px}
        .location-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
        .loc{background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:12px;text-align:center;font-weight:bold;font-size:12px}
        .loc small{color:#718096;font-weight:normal}
        .empty{text-align:center;padding:35px;color:#718096}
        .back{margin-bottom:12px}
        .modal-backdrop{position:fixed;inset:0;background:rgba(2,12,24,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
        .modal{width:min(650px,100%);background:#fff;border-radius:15px;padding:22px;max-height:90vh;overflow:auto}
        .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
        .modal-header h3{margin:0}
        .modal-close{border:0;background:#eef2f7;width:34px;height:34px;border-radius:50%;font-size:18px}
        .login-screen{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fff}
        .login-left{background:#081a2d;color:#fff;padding:70px;display:flex;flex-direction:column;justify-content:center}
        .login-left .logo{font-size:30px;font-weight:bold}
        .login-left h1{font-size:45px;line-height:1.08;max-width:520px;margin:35px 0 18px}
        .login-left p{color:#a9bdd3;max-width:500px;line-height:1.7}
        .login-right{display:flex;align-items:center;justify-content:center;padding:35px;background:#f7f9fc}
        .login-card{width:min(430px,100%)}
        .login-card h2{font-size:28px;margin-bottom:8px}
        .login-card>p{color:#718096;margin-bottom:25px}
        .login-card .form-group{margin-bottom:15px}
        .login-button{width:100%;margin-top:10px;padding:13px}
        .password-wrap{position:relative}
        .password-wrap input{padding-right:75px}
        .show-pass{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#2563eb;font-size:12px;font-weight:bold}
        .security-footer{margin-top:18px;font-size:11px;color:#94a3b8;text-align:center}
        @media(max-width:1050px){
            .grid{grid-template-columns:repeat(2,1fr)}
            .summary-row{grid-template-columns:repeat(3,1fr)}
            .dashboard-hero{grid-template-columns:1fr}
        }
        @media(max-width:800px){
            .sidebar{width:210px}
            .content{margin-left:210px;width:calc(100% - 210px)}
            .form-grid{grid-template-columns:1fr}
            .form-group.full{grid-column:auto}
            .location-grid{grid-template-columns:repeat(5,1fr)}
            .login-screen{grid-template-columns:1fr}
            .login-left{display:none}
        }
        @media(max-width:600px){
            .sidebar{position:static;width:100%;height:auto}
            .app{display:block}
            .content{margin-left:0;width:100%;padding:14px}
            .grid{grid-template-columns:1fr}
            .summary-row{grid-template-columns:repeat(2,1fr)}
            .stock-highlight{grid-template-columns:1fr}
            .topbar{align-items:flex-start;flex-direction:column}
            .search{width:100%}
            .section-title{align-items:flex-start;flex-direction:column}
            .location-grid{grid-template-columns:repeat(2,1fr)}
            table{display:block;overflow-x:auto}
        }
    </style>
</head>

<body>

<div id="root"></div>

<script>
"use strict";

const state = {
    user: null,
    environment: null,
    currentScreen: null,
    data: {
        materiais: [
            {
                codigo: "MAT-001",
                descricao: "Cabo elétrico 10mm",
                unidade: "M",
                estoque: 850,

                minimo: 200,
                localizacao: "A01",

                categoria: "Elétrica"
            },
            {
                codigo: "MAT-002",
                descricao: "Disjuntor 32A",
                unidade: "UN",
                estoque: 45,
                valorUnitario: 42.9,
                minimo: 20,
                localizacao: "A02",
                projeto: "ALMOXARIFADO SANTARÉM",
                categoria: "Elétrica"
            },
            {
                codigo: "MAT-003",
                descricao: "Luva isolante",
                unidade: "PAR",
                estoque: 12,
                valorUnitario: 75,
                minimo: 10,
                localizacao: "B01",
                projeto: "ALMOXARIFADO SANTARÉM",
                categoria: "EPI"
            }
        ],
        projetos: [
            {
                id: "P-001",
                nome: "Projeto Santarém",
                status: "Ativo",
                percentual: 62,
                materiais: [
                    {
                        descricao: "Cabo elétrico 10mm",
                        planejado: 500,
                        recebido: 310,
                        utilizado: 120
                    },
                    {
                        descricao: "Disjuntor 32A",
                        planejado: 20,
                        recebido: 15,
                        utilizado: 4
                    }
                ]
            },
            {
                id: "P-002",
                nome: "Expansão Engenharia",
                status: "Ativo",
                percentual: 38,
                materiais: [
                    {
                        descricao: "Cabo elétrico 10mm",
                        planejado: 350,
                        recebido: 160,
                        utilizado: 70
                    }
                ]
            }
        ],
        entradas: [],
        saidas: []
    }
};

const USERS = {
    Gundim: {
        usuario: "Gundim",
        senha: "Gundim@adm01",
        cargo: "Administrador"
    },
    Jorge: {
        usuario: "Jorge",
        senha: "Jorge@gestor01",
        cargo: "Gestor"
    },
    Felipe: {
        usuario: "Felipe",
        senha: "Felipe@consultor01",
        cargo: "Consultor"
    },
    Robert: {
        usuario: "Robert",
        senha: "Robert@auxiliar01",
        cargo: "Auxiliar"
    }
};

function $(id) {
    return document.getElementById(id);
}

function esc(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function num(value) {
    return Number(value || 0).toLocaleString("pt-BR", {
        maximumFractionDigits: 2
    });
}

function moeda(value) {
    return Number(value || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function progress(value) {
    const n = Math.max(0, Math.min(100, Number(value || 0)));

    return `
        <div style="display:flex;align-items:center;gap:8px">
            <div class="progress">
                <span style="width:${n}%"></span>
            </div>
            <small>${n.toFixed(1)}%</small>
        </div>
    `;
}

function status(value) {
    const v = String(value || "");

    let cls = "active";

    if (v === "Concluído") cls = "done";
    if (v === "Cancelado") cls = "cancelled";

    return `<span class="status ${cls}">${esc(v)}</span>`;
}

function table(headers, rows) {
    if (!rows.length) {
        return `<div class="empty">Nenhum registro encontrado.</div>`;
    }

    return `
        <table>
            <thead>
                <tr>
                    ${headers.map(h => `<th>${h}</th>`).join("")}
                </tr>
            </thead>
            <tbody>
                ${rows.map(row => `
                    <tr>
                        ${row.map(cell => `<td>${cell}</td>`).join("")}
                    </tr>
                `).join("")}
            </tbody>
        </table>
    `;
}

function title(titleText, subtitle) {
    return `
        <div class="topbar">
            <div>
                <h1>${esc(titleText)}</h1>
                <p>${esc(subtitle || "")}</p>
            </div>
            <div class="warehouse">
                ALMOXARIFADO SANTARÉM
            </div>
        </div>
    `;
}

function save() {
    localStorage.setItem(
        "almox_control_data",
        JSON.stringify(state.data)
    );
}

function load() {
    try {
        const saved = localStorage.getItem(
            "almox_control_data"
        );

        if (saved) {
            state.data = JSON.parse(saved);
        }
    } catch {
        console.warn("Não foi possível carregar os dados.");
    }
}

function openModal(titleText, content) {
    const div = document.createElement("div");

    div.className = "modal-backdrop";

    div.innerHTML = `
        <div class="modal">
            <div class="modal-header">
                <h3>${esc(titleText)}</h3>
                <button class="modal-close">×</button>
            </div>
            ${content}
        </div>
    `;

    document.body.appendChild(div);

    div.querySelector(".modal-close").onclick =
        () => div.remove();

    div.addEventListener("click", e => {
        if (e.target === div) {
            div.remove();
        }
    });
}

function closeModal() {
    document.querySelector(".modal-backdrop")?.remove();
}

function loginScreen() {
    document.body.innerHTML = `
        <div class="login-screen">
            <div class="login-left">
                <div class="logo">L&L</div>

                <h1>
                    Gestão que começa pelo controle.
                </h1>

                <p>
                    ALMOX CONTROL centraliza estoque,
                    projetos e movimentações para tornar
                    a operação mais organizada, rastreável
                    e eficiente.
                </p>
            </div>

            <div class="login-right">
                <div class="login-card">
                    <h2>Entrar no sistema</h2>

                    <p>
                        Informe suas credenciais para acessar
                        o ALMOX CONTROL.
                    </p>

                    <form id="loginForm">

                        <div class="form-group">
                            <label>Usuário</label>
                            <input
                                id="loginUser"
                                autocomplete="username"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label>Senha</label>

                            <div class="password-wrap">
                                <input
                                    id="loginPassword"
                                    type="password"
                                    autocomplete="current-password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="show-pass"
                                    id="showPassword"
                                >
                                    Mostrar
                                </button>
                            </div>
                        </div>

                        <button
                            class="btn login-button"
                            type="submit"
                        >
                            Entrar
                        </button>

                    </form>

                    <div class="security-footer">
                        Acesso protegido • ALMOX CONTROL
                    </div>
                </div>
            </div>
        </div>
    `;

    $("showPassword").onclick = () => {
        const input = $("loginPassword");

        if (input.type === "password") {
            input.type = "text";
            $("showPassword").textContent = "Ocultar";
        } else {
            input.type = "password";
            $("showPassword").textContent = "Mostrar";
        }
    };

    $("loginForm").onsubmit = e => {
        e.preventDefault();

        const usuario = $("loginUser").value.trim();
        const senha = $("loginPassword").value;

        const user = USERS[usuario];

        if (!user || user.senha !== senha) {
            alert("Usuário ou senha inválidos.");
            return;
        }

        state.user = {
            usuario: user.usuario,
            cargo: user.cargo
        };

        localStorage.setItem(
            "almox_control_user",
            JSON.stringify(state.user)
        );

        environmentScreen();
    };
}

function environmentScreen() {
    document.body.innerHTML = `
        <div class="login-screen">

            <div class="login-left">
                <div class="logo">ALMOX CONTROL</div>

                <h1>
                    Escolha o ambiente.
                </h1>

                <p>
                    Selecione o almoxarifado que deseja
                    administrar nesta sessão.
                </p>
            </div>

            <div class="login-right">
                <div class="login-card">

                    <h2>Ambiente</h2>

                    <p>
                        Olá, ${esc(state.user.usuario)}.
                        Escolha onde deseja trabalhar.
                    </p>

                    <div style="display:grid;gap:12px">

                        <button
                            class="btn"
                            id="engEnvironment"
                            style="padding:18px;text-align:left"
                        >
                            ⚡
                            <strong style="display:block;font-size:16px">
                                Almoxarifado da Engenharia
                            </strong>
                            <small style="opacity:.8">
                                Materiais, projetos e movimentações
                            </small>
                        </button>

                        <button
                            class="btn"
                            id="secEnvironment"
                            style="padding:18px;text-align:left;background:#0f766e"
                        >
                            🛡️
                            <strong style="display:block;font-size:16px">
                                Almoxarifado da Segurança
                            </strong>
                            <small style="opacity:.8">
                                Colaboradores, equipamentos e agenda
                            </small>
                        </button>

                    </div>

                    <button
                        class="btn btn-secondary"
                        id="logoutEnvironment"
                        style="width:100%;margin-top:15px"
                    >
                        Sair
                    </button>

                </div>
            </div>

        </div>
    `;

    $("engEnvironment").onclick = () => {
        state.environment = "engenharia";
        state.currentScreen = "dashboard";
        renderApp();
    };

    $("secEnvironment").onclick = () => {
        state.environment = "seguranca";
        state.currentScreen = "dashboard";
        renderSecurity();
    };

    $("logoutEnvironment").onclick = () => {
        state.user = null;
        localStorage.removeItem("almox_control_user");
        loginScreen();
    };
}

function renderApp() {
    document.body.innerHTML = `
        <div class="app">

            <aside class="sidebar">

                <div class="brand">
                    <strong>ALMOX CONTROL</strong>
                    <small>Engenharia</small>
                </div>

                <div class="user-box">
                    <strong>${esc(state.user.usuario)}</strong>
                    <small>${esc(state.user.cargo)}</small>
                </div>

                <div class="nav">

                    <div class="nav-title">Operação</div>

                    <button data-screen="dashboard">
                        Dashboard
                    </button>

                    <button data-screen="estoque">
                        Estoque
                    </button>

                    <button data-screen="projetos">
                        Projetos
                    </button>

                    <button data-screen="entradas">
                        Entrada no Almoxarifado
                    </button>

                    <button data-screen="saidas">
                        Saída do Almoxarifado
                    </button>

                    <div class="nav-title">Controle</div>

                    <button data-screen="inventario">
                        Inventário
                    </button>

                    <button data-screen="localizacao">
                        Localização
                    </button>

                    <button data-screen="gestao">
                        Área da Gestão
                    </button>

                </div>

                <button
                    class="logout"
                    id="logout"
                >
                    Sair
                </button>

            </aside>

            <main class="content" id="main"></main>

        </div>
    `;

    document
        .querySelectorAll("[data-screen]")
        .forEach(button => {
            button.onclick = () => {
                state.currentScreen =
                    button.dataset.screen;

                renderCurrentScreen();
            };
        });

    $("logout").onclick = () => {
        state.user = null;
        state.environment = null;

        localStorage.removeItem(
            "almox_control_user"
        );

        loginScreen();
    };

    renderCurrentScreen();
}

function renderCurrentScreen() {
    document
        .querySelectorAll("[data-screen]")
        .forEach(button => {
            button.classList.toggle(
                "active",
                button.dataset.screen ===
                    state.currentScreen
            );
        });

    const screens = {
        dashboard,
        estoque,
        projetos,
        entradas,
        saidas,
        inventario,
        localizacao,
        gestao
    };

    const fn =
        screens[state.currentScreen] ||
        dashboard;

    fn();
}

function dashboard() {
    const m = state.data.materiais;
    const p = state.data.projetos;

    const valor = m.reduce(
        (s, x) =>
            s +
            (Number(x.estoque) || 0) *
            (Number(x.valorUnitario) || 0),
        0
    );

    const baixos = m.filter(
        x =>
            (Number(x.estoque) || 0) <=
            (Number(x.minimo) || 0)
    ).length;

    const ativos =
        p.filter(x => x.status === "Ativo").length;

    const concl =
        p.filter(x => x.status === "Concluído").length;

    const canc =
        p.filter(x => x.status === "Cancelado").length;

    const totalPlan = p.reduce(
        (s, projeto) =>
            s +
            (projeto.materiais || []).reduce(
                (a, m) =>
                    a + (Number(m.planejado) || 0),
                0
            ),
        0
    );

    const totalRec = p.reduce(
        (s, projeto) =>
            s +
            (projeto.materiais || []).reduce(
                (a, m) =>
                    a + (Number(m.recebido) || 0),
                0
            ),
        0
    );

function projectDetail(id) {

    const p =
        state.data.projetos.find(
            x => x.id === id
        );

    if (!p) {
        return projetos();
    }

    const mats = p.materiais || [];

    const plan =
        mats.reduce(
            (s, m) =>
                s + (Number(m.planejado) || 0),
            0
        );

    const rec =
        mats.reduce(
            (s, m) =>
                s + (Number(m.recebido) || 0),
            0
        );

    const use =
        mats.reduce(
            (s, m) =>
                s + (Number(m.utilizado) || 0),
            0
        );

    const saldo =
        mats.reduce(
            (s, m) =>
                s +
                Math.max(
                    0,
                    (Number(m.recebido) || 0) -
                    (Number(m.utilizado) || 0)
                ),
            0
        );

    const pend =
        Math.max(
            0,
            plan - rec
        );

    $("main").innerHTML =

        `
        <button
            class="btn btn-secondary back"
            id="backProjects"
        >
            ← Voltar para projetos
        </button>
        ` +

        title(
            p.nome,
            "Detalhamento do atendimento de materiais do projeto"
        ) +

        `
        <div class="panel">

            <div class="summary-row">

                <div class="summary">
                    <small>Planejado</small>
                    <strong>${num(plan)}</strong>
                </div>

                <div class="summary">
                    <small>Recebido</small>
                    <strong>${num(rec)}</strong>
                </div>

                <div class="summary">
                    <small>Utilizado</small>
                    <strong>${num(use)}</strong>
                </div>

                <div class="summary">
                    <small>Saldo</small>
                    <strong>${num(saldo)}</strong>
                </div>

                <div class="summary">
                    <small>Pendente</small>
                    <strong>${num(pend)}</strong>
                </div>

                <div class="summary">
                    <small>Conclusão</small>
                    <strong>${progress(p.percentual)}</strong>
                </div>

            </div>

        </div>

        <div class="panel">

            <div class="section-title">

                <h3>Materiais do projeto</h3>

                <button
                    class="btn"
                    id="addProjectMaterial"
                >
                    Adicionar material
                </button>

            </div>

            ${
                table(
                    [
                        "Material",
                        "Planejado",
                        "Recebido",
                        "Utilizado",
                        "Saldo",
                        "Pendente",
                        "Ação"
                    ],
                    mats.map((m, i) => {

                        const saldo =
                            Math.max(
                                0,
                                (Number(m.recebido) || 0) -
                                (Number(m.utilizado) || 0)
                            );

                        const pend =
                            Math.max(
                                0,
                                (Number(m.planejado) || 0) -
                                (Number(m.recebido) || 0)
                            );

                        return [
                            esc(m.descricao),
                            num(m.planejado),
                            num(m.recebido),
                            num(m.utilizado),
                            num(saldo),
                            num(pend),
                            `
                            <button
                                class="btn btn-secondary edit-material"
                                onclick="openEditProjectMaterialModal('${p.id}', ${i})"
                            >
                                Editar
                            </button>
                            `
                        ];
                    })
                )
            }

        </div>
        `;

    $("backProjects").onclick =
        () => projetos();

    $("addProjectMaterial").onclick =
        () => openProjectMaterialModal(p);
}

function recalcProject(p) {

    const total =
        p.materiais.reduce(
            (s, m) =>
                s + (Number(m.planejado) || 0),
            0
        );

    const rec =
        p.materiais.reduce(
            (s, m) =>
                s + (Number(m.recebido) || 0),
            0
        );

    p.percentual =
        total
            ? Math.min(
                100,
                (rec / total) * 100
            )
            : 0;

    p.materiais.forEach(m => {

        m.saldo =
            Math.max(
                0,
                (Number(m.recebido) || 0) -
                (Number(m.utilizado) || 0)
            );

        m.pendente =
            Math.max(
                0,
                (Number(m.planejado) || 0) -
                (Number(m.recebido) || 0)
            );
    });
}

                    ${d.saidas.length}
                </span>

            </div>

            ${
                table(
                    [
                        "Data",
                        "Material",
                        "Quantidade",
                        "Projeto",
                        "Responsável",
                        "Observação"
                    ],
                    d.saidas.map(e => [
                        esc(e.data),
                        esc(e.material),
                        num(e.quantidade),
                        esc(e.projetoNome || "-"),
                        esc(e.responsavel || "-"),
                        esc(e.observacao || "-")
                    ])
                )
            }

        </div>
        `;

    $("saidaForm").onsubmit = e => {

        e.preventDefault();

        const f =
            Object.fromEntries(
                new FormData(e.target)
            );

        const mat =
            d.materiais.find(
                m => m.codigo === f.material
            );

        const proj =
            d.projetos.find(
                p => p.id === f.projeto
            );

        const qtd =
            Number(f.quantidade) || 0;

        if (
            !mat ||
            !proj ||
            qtd <= 0 ||
            qtd > (Number(mat.estoque) || 0)
        ) {
            alert(
                "Quantidade inválida ou estoque insuficiente."
            );

            return;
        }

        mat.estoque =
            (Number(mat.estoque) || 0) -
            qtd;

        let item =
            (proj.materiais || [])
                .find(
                    m =>
                        m.descricao ===
                        mat.descricao
                );

        if (!item) {

            item = {
                descricao: mat.descricao,
                planejado: qtd,
                recebido: 0,
                utilizado: 0
            };

            proj.materiais.push(item);
        }

        item.recebido =
            (Number(item.recebido) || 0) +
            qtd;

        recalcProject(proj);

        d.saidas.unshift({
            ...f,
            material: mat.descricao,
            projetoNome: proj.nome,
            quantidade: qtd
        });

        save();
        saidas();
    };
}

function inventario() {

    const m = state.data.materiais;

    $("main").innerHTML =
        title(
            "Inventário",
            "Conferência física dos materiais do Almoxarifado."
        ) +

        `
        <div class="panel">

            <div class="section-title">
                <h3>Inventário</h3>

                <span class="history-badge">
                    ${m.length} materiais
                </span>
            </div>

            ${
                table(
                    [
                        "Código",
                        "Material",
                        "Sistema",
                        "Físico",
                        "Diferença"
                    ],
                    m.map(x => {

                        const fisico =
                            x.fisico !== undefined
                                ? x.fisico
                                : x.estoque;

                        const dif =
                            Number(fisico || 0) -
                            Number(x.estoque || 0);

                        return [
                            esc(x.codigo),
                            esc(x.descricao),
                            num(x.estoque),
                            `
                            <input
                                type="number"
                                step="0.01"
                                value="${fisico}"
                                onchange="updateFisico('${esc(x.codigo)}', this.value)"
                            >
                            `,
                            num(dif)
                        ];
                    })
                )
            }

        </div>
        `;
}

function updateFisico(codigo, value) {

    const mat =
        state.data.materiais.find(
            m => m.codigo === codigo
        );

    if (!mat) return;

    mat.fisico =
        Number(value) || 0;

    save();
}
